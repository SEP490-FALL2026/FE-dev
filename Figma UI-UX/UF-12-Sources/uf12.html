<!doctype html>
<html lang="vi" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UF-12 · SaaS-Sentry</title>
    <link rel="stylesheet" href="uf12.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="uf12-data.js"></script>
    <script src="uf12-renderer.js"></script>
    <script>
      const q = new URLSearchParams(location.search),
        theme = q.get('theme') === 'dark' ? 'dark' : 'light',
        screen = (q.get('screen') || '01').padStart(2, '0')
      document.documentElement.dataset.theme = theme
      const data = window.UF12Data.createUF12Data()
      document.querySelector('#root').innerHTML = window.UF12Renderer.renderApp(data, screen)
      const app = document.querySelector('.app')
      const overflow =
        document.documentElement.scrollWidth > 1440 ||
        document.documentElement.scrollHeight > 1024 ||
        app.scrollWidth > 1440 ||
        app.scrollHeight > 1024
      app.dataset.renderReady = 'true'
      app.dataset.overflow = String(overflow)
    </script>
  </body>
</html>
