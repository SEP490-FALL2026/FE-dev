<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UF-14 · IT Admin xử lý sai lệch và mâu thuẫn dữ liệu</title>
  <link rel="stylesheet" href="uf14.css">
</head>
<body>
  <div id="app"></div>
  <script src="uf14-data.js"></script>
  <script src="uf14-renderer.js"></script>
  <script>
    (function boot() {
      const params = new URLSearchParams(window.location.search);
      const theme = params.get('theme') === 'dark' ? 'dark' : 'light';
      const screenId = params.get('screen') || '01';
      const data = window.UF14Data.createUF14Data();
      const screen = data.screens.find(s => s.id === screenId) || data.screens[0];

      document.documentElement.dataset.theme = theme;
      document.title = `UF-14 ${theme.toUpperCase()} ${screen.id} · ${screen.title}`;
      document.getElementById('app').innerHTML = window.UF14Renderer.renderApp(data, screen.id);

      requestAnimationFrame(() => requestAnimationFrame(() => {
        const root = document.querySelector('.app-shell');
        const hasOverflow = root && (
          root.scrollWidth > 1440 ||
          root.scrollHeight > 1024 ||
          document.documentElement.scrollWidth > 1440 ||
          document.documentElement.scrollHeight > 1024
        );
        document.body.dataset.renderReady = 'true';
        document.body.dataset.overflow = hasOverflow ? 'true' : 'false';
      }));
    })();
  </script>
</body>
</html>
