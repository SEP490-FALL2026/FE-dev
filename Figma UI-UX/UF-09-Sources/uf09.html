<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1440, initial-scale=1">
  <title>UF-09 · Employee offboarding</title>
  <link rel="stylesheet" href="./uf09.css">
</head>
<body>
  <div id="root"></div>
  <script src="./uf09-data.js"></script>
  <script src="./uf09-renderer.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const theme = params.get('theme') === 'dark' ? 'dark' : 'light';
      const screen = String(params.get('screen') || '01').padStart(2, '0');
      document.documentElement.dataset.theme = theme;
      document.title = `UF-09 · ${theme} · ${screen}`;

      const data = window.UF09Data.createUF09Data();
      document.getElementById('root').innerHTML = window.UF09Renderer.renderApp(data, screen);

      requestAnimationFrame(() => requestAnimationFrame(() => {
        const app = document.querySelector('.app');
        const overflow = !app || app.scrollWidth > 1440 || app.scrollHeight > 1024
          || document.documentElement.scrollWidth > 1440 || document.documentElement.scrollHeight > 1024;
        document.documentElement.dataset.overflow = String(overflow);
        document.documentElement.dataset.renderReady = 'true';
      }));
    })();
  </script>
</body>
</html>
